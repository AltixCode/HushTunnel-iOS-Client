name: iOS Build & App Store Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      upload_to_app_store:
        description: 'Upload to TestFlight / App Store Connect'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        type: string
      release_title:
        description: 'Release Title'
        required: false
        type: string
        default: 'HushTunnel iOS Release'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Select Xcode Version
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" -o -name "Xcode.app" | sort -V | tail -n 1)
          if [ -n "$XCODE_PATH" ]; then
            echo "Selecting $XCODE_PATH"
            sudo xcode-select -s "$XCODE_PATH"
          fi
          xcodebuild -version

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies -project sing-box.xcodeproj

      - name: Compute Dynamic Version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "Computed Version: 1.0.$COMMIT_COUNT (Build: $COMMIT_COUNT)"
          echo "APP_MARKETING_VERSION=1.0.$COMMIT_COUNT" >> $GITHUB_ENV
          echo "APP_BUILD_NUMBER=$COMMIT_COUNT" >> $GITHUB_ENV

      - name: Setup Keychain & Certificates (if provided)
        id: keychain_setup
        run: |
          if [ -n "${{ secrets.APPLE_CERTIFICATE_BASE64 }}" ] && [ -n "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" ]; then
            echo "Configuring Apple Distribution Certificate..."
            KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
            KEYCHAIN_PASSWORD=$(openssl rand -base64 12)

            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

            CERT_PATH=$RUNNER_TEMP/certificate.p12
            echo "${{ secrets.APPLE_CERTIFICATE_BASE64 }}" | base64 -d > "$CERT_PATH"
            security import "$CERT_PATH" -P "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

            # Provisioning Profile
            if [ -n "${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}" ]; then
              mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
              echo "${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
            fi
            
            echo "SIGNING_CONFIGURED=true" >> $GITHUB_ENV
          else
            echo "No Apple Certificate secret provided. Proceeding with Simulator/Unsigned build."
            echo "SIGNING_CONFIGURED=false" >> $GITHUB_ENV
          fi

      - name: Build & Archive iOS App
        run: |
          mkdir -p build/output
          
          if [ "$SIGNING_CONFIGURED" = "true" ]; then
            echo "Building with Code Signing for App Store / TestFlight..."
            xcodebuild archive \
              -project sing-box.xcodeproj \
              -scheme SFI \
              -archivePath build/HushTunnel.xcarchive \
              -destination 'generic/platform=iOS' \
              -allowProvisioningUpdates \
              MARKETING_VERSION="${{ env.APP_MARKETING_VERSION }}" \
              CURRENT_PROJECT_VERSION="${{ env.APP_BUILD_NUMBER }}"
              
            echo "Exporting IPA package..."
            cat << 'PLIST_EOF' > build/exportOptions.plist
            <?xml version="1.0" encoding="UTF-8"?>
            <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
            <plist version="1.0">
            <dict>
                <key>method</key>
                <string>app-store</string>
                <key>signingStyle</key>
                <string>automatic</string>
                <key>stripSwiftSymbols</key>
                <true/>
                <key>uploadSymbols</key>
                <true/>
            </dict>
            </plist>
          PLIST_EOF
            xcodebuild -exportArchive \
              -archivePath build/HushTunnel.xcarchive \
              -exportPath build/output \
              -exportOptionsPlist build/exportOptions.plist
              
          else
            echo "Building iOS App Bundle (Unsigned/Simulator)..."
            xcodebuild build \
              -project sing-box.xcodeproj \
              -scheme SFI \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build/DerivedData \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              MARKETING_VERSION="${{ env.APP_MARKETING_VERSION }}" \
              CURRENT_PROJECT_VERSION="${{ env.APP_BUILD_NUMBER }}"
              
            mkdir -p build/output/Payload
            cp -r build/DerivedData/Build/Products/Debug-iphoneos/HushTunnel.app build/output/Payload/ || \
            cp -r build/DerivedData/Build/Products/Release-iphoneos/HushTunnel.app build/output/Payload/ || \
            cp -r build/DerivedData/Build/Products/*-iphoneos/*.app build/output/Payload/ || true
            
            cd build/output && zip -r HushTunnel.ipa Payload && cd ../..
          fi

      - name: Upload to App Store Connect / TestFlight
        if: env.SIGNING_CONFIGURED == 'true' && (inputs.upload_to_app_store == true || startsWith(github.ref, 'refs/tags/'))
        run: |
          if [ -n "${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}" ]; then
            echo "Uploading IPA to App Store Connect / TestFlight via altool..."
            mkdir -p ~/.appstoreconnect/private_keys
            echo "${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8
            
            xcrun altool --upload-app \
              -f build/output/HushTunnel.ipa \
              -t ios \
              --apiKey "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" \
              --apiIssuer "${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER }}"
          else
            echo "Skipping App Store upload: APP_STORE_CONNECT_API_KEY_CONTENT secret not configured."
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HushTunnel-iOS-IPA
          path: |
            build/output/*.ipa
            build/output/HushTunnel.ipa

      - name: Determine Release Tag
        id: tag_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.release_tag }}" ]; then
            TAG_NAME="${{ inputs.release_tag }}"
          elif [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="ios-v1.0.0-build.${{ github.run_number }}"
          fi
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.tag_info.outputs.TAG_NAME }}
          name: ${{ inputs.release_title || steps.tag_info.outputs.TAG_NAME }}
          body: |
            ## HushTunnel iOS Release (${{ steps.tag_info.outputs.TAG_NAME }})

            ### What's New:
            - **Multi-Server Location Switching**: Instant interactive server node switcher.
            - **SaaS Store Compliance**: Multi-device account management text linking to `https://www.hushtunnel.com`.
            - **Reseller Self-Service Suite**: Complete administrative customer management and password recovery.
            - **Full Localization**: English, Persian (RTL), Russian, Simplified Chinese, and Turkish.

            ### Package:
            - **`HushTunnel.ipa`**: Packaged iOS application archive for TestFlight and direct enterprise/ad-hoc deployment.
          draft: false
          prerelease: false
          files: |
            build/output/*.ipa
            build/output/HushTunnel.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
