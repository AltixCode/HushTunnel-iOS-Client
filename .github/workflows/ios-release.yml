name: iOS Build & App Store Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - dev
  workflow_dispatch:
    inputs:
      upload_to_app_store:
        description: 'Upload to TestFlight / App Store Connect'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        type: string
      release_title:
        description: 'Release Title'
        required: false
        type: string
        default: 'HushTunnel iOS Release'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Select Xcode Version & Set Developer Directory
        run: |
          echo "Listing installed Xcode versions..."
          ls -d /Applications/Xcode* || true
          
          # Detect installed Xcode paths
          if [ -d "/Applications/Xcode-beta.app" ]; then
            DEV_DIR="/Applications/Xcode-beta.app/Contents/Developer"
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            DEV_DIR="/Applications/Xcode_16.1.app/Contents/Developer"
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            DEV_DIR="/Applications/Xcode_16.0.app/Contents/Developer"
          elif [ -d "/Applications/Xcode.app" ]; then
            DEV_DIR="/Applications/Xcode.app/Contents/Developer"
          else
            DEV_DIR="$(xcode-select -p 2>/dev/null || echo '/Applications/Xcode.app/Contents/Developer')"
          fi
          
          echo "Using Developer Directory: $DEV_DIR"
          echo "DEVELOPER_DIR=$DEV_DIR" >> $GITHUB_ENV
          export DEVELOPER_DIR="$DEV_DIR"
          
          xcodebuild -version
          
          # Ensure iOS platform runtime/device support is present
          xcodebuild -downloadPlatform iOS 2>/dev/null || true
          
          # Output available destinations for verification
          xcodebuild -showdestinations -project sing-box.xcodeproj -scheme SFI || true

      - name: Setup Libbox.xcframework
        run: |
          # 1. Prefer existing verified local Libbox.xcframework if available on runner host
          for LOCAL_PATH in "/Users/atamohammadi/Dev/vpn-ios-client/Libbox.xcframework" "$HOME/Dev/vpn-ios-client/Libbox.xcframework" "/Users/ata/Dev/vpn-ios-client/Libbox.xcframework"; do
            if [ -d "$LOCAL_PATH" ] && [ -f "$LOCAL_PATH/Info.plist" ]; then
              echo "Found verified local Libbox.xcframework at $LOCAL_PATH - copying..."
              rm -rf ./Libbox.xcframework
              cp -r "$LOCAL_PATH" ./Libbox.xcframework
              break
            fi
          done

          # 2. Build from pinned stable sing-box core (commit bdd86c1) if not present
          if [ ! -d "Libbox.xcframework" ] || [ ! -f "Libbox.xcframework/Info.plist" ]; then
            echo "Building Libbox.xcframework from pinned stable sing-box core (commit bdd86c1)..."
            rm -rf /tmp/sing-box-source
            git clone https://github.com/sagernet/sing-box.git /tmp/sing-box-source
            pushd /tmp/sing-box-source
            git checkout bdd86c1
            go install github.com/sagernet/gomobile/cmd/gomobile@latest
            go install github.com/sagernet/gomobile/cmd/gobind@latest
            export PATH=$(go env GOPATH)/bin:$PATH
            gomobile init
            go run ./cmd/internal/build_libbox -target apple -platform ios
            popd
            cp -r /tmp/sing-box-source/Libbox.xcframework ./Libbox.xcframework
          fi
          
          echo "Libbox.xcframework setup complete."

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies -project sing-box.xcodeproj -scheme SFI -derivedDataPath build/DerivedData

      - name: Compute Dynamic Version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "Computed Version: 1.0.$COMMIT_COUNT (Build: $COMMIT_COUNT)"
          echo "APP_MARKETING_VERSION=1.0.$COMMIT_COUNT" >> $GITHUB_ENV
          echo "APP_BUILD_NUMBER=$COMMIT_COUNT" >> $GITHUB_ENV

      - name: Setup Signing Keychain & App Store API Key
        id: keychain_setup
        env:
          API_KEY_DATA: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 || secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_KEY_ISSUER: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER }}
          DEV_P12_BASE64: ${{ secrets.APPLE_DEVELOPMENT_P12_BASE64 || secrets.APPLE_DEVELOPER_P12_BASE64 }}
          DEV_P12_PASS: ${{ secrets.APPLE_DEVELOPMENT_P12_PASSWORD || secrets.APPLE_DEVELOPER_P12_PASSWORD }}
          DIST_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 || secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 || secrets.APPLE_CERTIFICATE_BASE64 }}
          DIST_P12_PASS: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD || secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD || secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys

          # 1. Setup App Store Connect API Key (.p8)
          if [ -n "$API_KEY_DATA" ] && [ -n "$API_KEY_ID" ]; then
            echo "Setting up App Store Connect API Key: AuthKey_$API_KEY_ID.p8..."
            if printf '%s' "$API_KEY_DATA" | grep -q "BEGIN PRIVATE KEY"; then
              printf '%s\n' "$API_KEY_DATA" > ~/.appstoreconnect/private_keys/AuthKey_$API_KEY_ID.p8
            else
              printf '%s' "$API_KEY_DATA" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_$API_KEY_ID.p8
            fi
            chmod 600 ~/.appstoreconnect/private_keys/AuthKey_$API_KEY_ID.p8
            echo "API_KEY_CONFIGURED=true" >> $GITHUB_ENV
          else
            echo "API_KEY_CONFIGURED=false" >> $GITHUB_ENV
          fi

          # 2. Heal / normalize runner host default keychain (cures "Keychain Not Found" error on Mac mini)
          LOGIN_KEYCHAIN="$HOME/Library/Keychains/login.keychain-db"
          if [ ! -f "$LOGIN_KEYCHAIN" ]; then
            LOGIN_KEYCHAIN="$HOME/Library/Keychains/login.keychain"
          fi
          if [ -f "$LOGIN_KEYCHAIN" ]; then
            echo "Ensuring host default keychain is login keychain: $LOGIN_KEYCHAIN"
            security default-keychain -s "$LOGIN_KEYCHAIN" 2>/dev/null || true
            security unlock-keychain -p "" "$LOGIN_KEYCHAIN" 2>/dev/null || true
          fi

          # 3. Setup temporary dedicated keychain for this build job
          KEYCHAIN_PATH="$RUNNER_TEMP/build-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 12)

          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Trust chain: Apple has issued five generations of the Worldwide
          # Developer Relations intermediate CA (G2-G6), and a freshly issued
          # Development/Distribution certificate can chain through any of
          # them depending on when Apple minted it - importing only G3 (the
          # old default here) left newer certs unable to build a chain to
          # the root ("unable to build chain to self-signed root" /
          # errSecInternalComponent during codesign). Import every
          # generation, plus the root CAs, so whichever one a given
          # certificate actually needs is present.
          for CERT_URL in \
            https://www.apple.com/appleca/AppleIncRootCertificate.cer \
            https://www.apple.com/certificateauthority/AppleRootCA-G2.cer \
            https://www.apple.com/certificateauthority/AppleRootCA-G3.cer \
            https://www.apple.com/certificateauthority/AppleWWDRCAG2.cer \
            https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer \
            https://www.apple.com/certificateauthority/AppleWWDRCAG4.cer \
            https://www.apple.com/certificateauthority/AppleWWDRCAG5.cer \
            https://www.apple.com/certificateauthority/AppleWWDRCAG6.cer \
          ; do
            CERT_FILE="$RUNNER_TEMP/$(basename "$CERT_URL")"
            if curl --fail --silent --show-error --location "$CERT_URL" --output "$CERT_FILE"; then
              security import "$CERT_FILE" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign 2>/dev/null || true
            else
              echo "::warning::Could not download $CERT_URL - skipping"
            fi
          done

          # Import Apple Development certificate (for xcodebuild archive with automatic signing)
          if [ -n "$DEV_P12_BASE64" ]; then
            echo "Importing Apple Development Certificate (.p12)..."
            DEV_CERT_PATH="$RUNNER_TEMP/dev_cert.p12"
            export DEV_RAW="$DEV_P12_BASE64"
            python3 -c "import base64, os; raw=''.join(os.environ['DEV_RAW'].split()); open('$DEV_CERT_PATH', 'wb').write(base64.b64decode(raw, validate=True))"
            chmod 600 "$DEV_CERT_PATH"
            security import "$DEV_CERT_PATH" -k "$KEYCHAIN_PATH" -P "$DEV_P12_PASS" -T /usr/bin/codesign -T /usr/bin/security
            if [ -f "$LOGIN_KEYCHAIN" ]; then
              security import "$DEV_CERT_PATH" -k "$LOGIN_KEYCHAIN" -P "$DEV_P12_PASS" -T /usr/bin/codesign -T /usr/bin/security -A 2>/dev/null || true
            fi
          fi

          # Import Apple Distribution certificate (for xcodebuild exportArchive to App Store)
          if [ -n "$DIST_P12_BASE64" ]; then
            echo "Importing Apple Distribution Certificate (.p12)..."
            DIST_CERT_PATH="$RUNNER_TEMP/dist_cert.p12"
            export DIST_RAW="$DIST_P12_BASE64"
            python3 -c "import base64, os; raw=''.join(os.environ['DIST_RAW'].split()); open('$DIST_CERT_PATH', 'wb').write(base64.b64decode(raw, validate=True))"
            chmod 600 "$DIST_CERT_PATH"
            security import "$DIST_CERT_PATH" -k "$KEYCHAIN_PATH" -P "$DIST_P12_PASS" -T /usr/bin/codesign -T /usr/bin/security
            if [ -f "$LOGIN_KEYCHAIN" ]; then
              security import "$DIST_CERT_PATH" -k "$LOGIN_KEYCHAIN" -P "$DIST_P12_PASS" -T /usr/bin/codesign -T /usr/bin/security -A 2>/dev/null || true
            fi
          fi

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          if [ -f "$LOGIN_KEYCHAIN" ]; then
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$LOGIN_KEYCHAIN" 2>/dev/null || true
          fi

          # Set user keychain search list: build keychain first, login keychain second
          if [ -f "$LOGIN_KEYCHAIN" ]; then
            security list-keychains -d user -s "$KEYCHAIN_PATH" "$LOGIN_KEYCHAIN"
          else
            security list-keychains -d user -s "$KEYCHAIN_PATH"
          fi

          echo "Codesigning identities in build keychain:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV
          echo "KEYCHAIN_CREATED=true" >> $GITHUB_ENV
          echo "SIGNING_CONFIGURED=true" >> $GITHUB_ENV

      - name: Build & Export Signed App Store Package
        run: |
          mkdir -p build/output
          mkdir -p build/DerivedData

          # Clean stale build artifacts and local CI derived data
          rm -rf build/HushTunnel.xcarchive build/output/* build/DerivedData/* 2>/dev/null || true

          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            echo "Unlocking build signing keychain..."
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          fi

          LOGIN_KEYCHAIN="$HOME/Library/Keychains/login.keychain-db"
          if [ ! -f "$LOGIN_KEYCHAIN" ]; then
            LOGIN_KEYCHAIN="$HOME/Library/Keychains/login.keychain"
          fi
          if [ -f "$LOGIN_KEYCHAIN" ]; then
            security unlock-keychain -p "" "$LOGIN_KEYCHAIN" 2>/dev/null || true
            security list-keychains -d user -s "$KEYCHAIN_PATH" "$LOGIN_KEYCHAIN"
          else
            security list-keychains -d user -s "$KEYCHAIN_PATH"
          fi

          echo "Active codesigning identities in session:"
          security find-identity -v -p codesigning || true
          VERSION="${{ env.APP_MARKETING_VERSION }}"
          BUILD_NUM="${{ env.APP_BUILD_NUMBER }}"

          AUTH_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8"

          echo "Building Release xcarchive with Xcode (automatic signing)..."
          if [ "$API_KEY_CONFIGURED" = "true" ] && [ -f "$AUTH_KEY_PATH" ]; then
            echo "Archiving with automatic signing + App Store Connect API key (-allowProvisioningUpdates)..."
            xcodebuild archive \
              -project sing-box.xcodeproj \
              -scheme SFI \
              -archivePath build/HushTunnel.xcarchive \
              -derivedDataPath build/DerivedData \
              -destination "generic/platform=iOS" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$AUTH_KEY_PATH" \
              -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" \
              -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER }}" \
              COMPILER_INDEX_STORE_ENABLE=NO \
              CODE_SIGN_STYLE=Automatic \
              DEVELOPMENT_TEAM="8Q8Y559285" \
              MARKETING_VERSION="$VERSION" \
              CURRENT_PROJECT_VERSION="$BUILD_NUM"
          else
            echo "No App Store Connect API key available - archiving with automatic signing against locally installed profiles/identities..."
            xcodebuild archive \
              -project sing-box.xcodeproj \
              -scheme SFI \
              -archivePath build/HushTunnel.xcarchive \
              -derivedDataPath build/DerivedData \
              -destination "generic/platform=iOS" \
              COMPILER_INDEX_STORE_ENABLE=NO \
              CODE_SIGN_STYLE=Automatic \
              DEVELOPMENT_TEAM="8Q8Y559285" \
              MARKETING_VERSION="$VERSION" \
              CURRENT_PROJECT_VERSION="$BUILD_NUM"
          fi

          echo "Preparing exportOptions.plist for App Store..."
          cat << 'PLIST_EOF' > build/exportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>8Q8Y559285</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>uploadSymbols</key>
              <true/>
              <key>destination</key>
              <string>export</string>
          </dict>
          </plist>
          PLIST_EOF
          sed -i "" "s/^[ 	]*//" build/exportOptions.plist || true

          if [ "$API_KEY_CONFIGURED" = "true" ] && [ -f "$AUTH_KEY_PATH" ]; then
            echo "Exporting signed App Store IPA with automatic provisioning from App Store Connect..."
            xcodebuild -exportArchive \
              -archivePath build/HushTunnel.xcarchive \
              -exportPath build/output \
              -exportOptionsPlist build/exportOptions.plist \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$AUTH_KEY_PATH" \
              -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" \
              -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER }}"
          else
            echo "Exporting with local keychain & provisioning profiles..."
            xcodebuild -exportArchive \
              -archivePath build/HushTunnel.xcarchive \
              -exportPath build/output \
              -exportOptionsPlist build/exportOptions.plist
          fi

          if [ -f "build/output/HushTunnel.ipa" ]; then
            cp build/output/HushTunnel.ipa build/output/HushTunnel-$VERSION.ipa
            echo "IPA exported successfully with embedded provisioning profile:"
            ls -lh build/output/
          else
            echo "Error: xcodebuild did not create HushTunnel.ipa"
            exit 1
          fi

      - name: Upload to App Store Connect / TestFlight
        if: env.API_KEY_CONFIGURED == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || inputs.upload_to_app_store == true || startsWith(github.ref, 'refs/tags/'))
        run: |
          echo "Uploading IPA to App Store Connect / TestFlight via altool..."
          xcrun altool --upload-app \
            -f build/output/HushTunnel.ipa \
            -t ios \
            --apiKey "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER }}"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HushTunnel-iOS-IPA
          path: |
            build/output/*.ipa
            build/output/HushTunnel.ipa

      - name: Determine Release Tag
        id: tag_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.release_tag }}" ]; then
            TAG_NAME="${{ inputs.release_tag }}"
          elif [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v${{ env.APP_MARKETING_VERSION }}"
          fi
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Generate Dynamic Release Notes
        run: |
          VERSION="${{ env.APP_MARKETING_VERSION }}"
          TAG="${{ steps.tag_info.outputs.TAG_NAME }}"
          BUILD="${{ env.APP_BUILD_NUMBER }}"

          # Generate SHA256 checksums
          cd build/output
          shasum -a 256 *.ipa > SHA256SUMS.txt 2>/dev/null || sha256sum *.ipa > SHA256SUMS.txt 2>/dev/null || true
          cd ../..

          # Extract recent changelog
          CHANGELOG=$(git log --pretty=format:"* %s (%h)" -n 12)

          cat << 'HEADER_EOF' > RELEASE_NOTES.md
          ## 🛡️ HushTunnel iOS ${TAG} (Build ${BUILD})

          ### 🚀 What's New & Key Highlights
          - **Multi-Server Location Switching**: Instant interactive server node switcher with dynamic latency checks.
          - **Reseller Self-Service Suite**: Comprehensive customer creation with auto-generated/custom passwords, credential copy modal, and order creation handoff.
          - **Double-Entry Transactions Ledger**: Real-time balance debits/credits history, order tracking, and P2P audit logs.
          - **Full Localization (5 Languages)**: English, Persian (Farsi RTL), Russian, Simplified Chinese, and Turkish.
          - **App Store Review Compliance**: Multi-device account management text linking directly to official control plane at [hushtunnel.com](https://www.hushtunnel.com) (Guideline 3.1.1 compliant).

          ### 📦 Download Packages
          | Package | Description | Target Deployment |
          |---|---|---|
          | **`HushTunnel-${VERSION}.ipa`** (`HushTunnel.ipa`) | Packaged iOS Application Archive | TestFlight / Enterprise / Sideloading (iOS 15.0+) |

          ### 📝 Recent Changes
          HEADER_EOF

          echo "$CHANGELOG" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### 🔒 Binary Integrity (SHA-256)" >> RELEASE_NOTES.md
          echo '```text' >> RELEASE_NOTES.md
          cat build/output/SHA256SUMS.txt >> RELEASE_NOTES.md
          echo '```' >> RELEASE_NOTES.md

          # Replace environment variables in generated file
          sed -i '' "s/\${TAG}/$TAG/g" RELEASE_NOTES.md
          sed -i '' "s/\${BUILD}/$BUILD/g" RELEASE_NOTES.md
          sed -i '' "s/\${VERSION}/$VERSION/g" RELEASE_NOTES.md

      - name: Publish GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag_info.outputs.TAG_NAME }}
          TITLE: ${{ inputs.release_title || steps.tag_info.outputs.TAG_NAME }}
        run: |
          command -v gh >/dev/null 2>&1 || brew install gh

          # Re-running the same commit (manual re-run, or re-pushing to dev
          # without a new commit) recomputes the SAME tag every time. The
          # previous softprops/action-gh-release step would then hit a
          # "ReleaseAsset already_exists" error re-uploading identically
          # named assets (HushTunnel.ipa, SHA256SUMS.txt) to an already
          # -published release, and the release silently never got the new
          # build. Make this idempotent instead: create the release if it's
          # missing, then always (re)upload with --clobber so a re-run
          # unconditionally lands the fresh IPA, regardless of prior state.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists - updating notes and assets."
            gh release edit "$TAG" \
              --title "$TITLE" \
              --notes-file RELEASE_NOTES.md \
              --draft=false \
              --prerelease=false \
              --latest
          else
            echo "Creating release $TAG."
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes-file RELEASE_NOTES.md \
              --target "${{ github.sha }}" \
              --latest
          fi

          gh release upload "$TAG" \
            build/output/*.ipa \
            build/output/SHA256SUMS.txt \
            --clobber

      - name: Clean signing credentials
        if: always()
        run: |
          LOGIN_KEYCHAIN="$HOME/Library/Keychains/login.keychain-db"
          if [ ! -f "$LOGIN_KEYCHAIN" ]; then
            LOGIN_KEYCHAIN="$HOME/Library/Keychains/login.keychain"
          fi

          # Restore the search list and default keychain to the host login keychain
          # BEFORE deleting the temp keychain. This prevents the Mac mini from
          # ever losing its default keychain ("Keychain Not Found" error).
          if [ -f "$LOGIN_KEYCHAIN" ]; then
            security default-keychain -s "$LOGIN_KEYCHAIN" 2>/dev/null || true
            security list-keychains -d user -s "$LOGIN_KEYCHAIN" 2>/dev/null || true
          fi
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi
          rm -f "$RUNNER_TEMP/dev_cert.p12" "$RUNNER_TEMP/dist_cert.p12" "$RUNNER_TEMP/dist_cert.pem" "$RUNNER_TEMP"/Apple*.cer
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8"
