name: iOS Build & App Store Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      upload_to_app_store:
        description: 'Upload to TestFlight / App Store Connect'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        type: string
      release_title:
        description: 'Release Title'
        required: false
        type: string
        default: 'HushTunnel iOS Release'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Select Xcode Version & Install iOS SDK
        run: |
          echo "Listing installed Xcode versions..."
          ls -d /Applications/Xcode* || true
          
          # Prioritize Xcode with full preinstalled iOS device SDKs (16.1, 16.0, 16.2, or default)
          if [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_16.1.app"
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_16.0.app"
          elif [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_16.2.app"
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s "/Applications/Xcode.app"
          fi
          
          xcodebuild -version
          
          # Ensure iOS platform runtime/device support is present
          xcodebuild -downloadPlatform iOS || true
          
          # Output available destinations for verification
          xcodebuild -showdestinations -project sing-box.xcodeproj -scheme SFI || true

      - name: Cache Libbox.xcframework
        id: cache-libbox
        uses: actions/cache@v4
        with:
          path: Libbox.xcframework
          key: libbox-apple-${{ runner.os }}-v1.14

      - name: Build Libbox.xcframework
        if: steps.cache-libbox.outputs.cache-hit != 'true'
        run: |
          echo "Building Libbox.xcframework from core..."
          git clone --depth 1 https://github.com/sagernet/sing-box.git /tmp/sing-box-source
          pushd /tmp/sing-box-source
          go install github.com/sagernet/gomobile/cmd/gomobile@latest
          go install github.com/sagernet/gomobile/cmd/gobind@latest
          export PATH=$(go env GOPATH)/bin:$PATH
          gomobile init
          go run ./cmd/internal/build_libbox -target apple -platform ios
          popd
          cp -r /tmp/sing-box-source/Libbox.xcframework ./Libbox.xcframework

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies -project sing-box.xcodeproj

      - name: Compute Dynamic Version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "Computed Version: 1.0.$COMMIT_COUNT (Build: $COMMIT_COUNT)"
          echo "APP_MARKETING_VERSION=1.0.$COMMIT_COUNT" >> $GITHUB_ENV
          echo "APP_BUILD_NUMBER=$COMMIT_COUNT" >> $GITHUB_ENV

      - name: Setup Keychain & Certificates (if provided)
        id: keychain_setup
        run: |
          if [ -n "${{ secrets.APPLE_CERTIFICATE_BASE64 }}" ] && [ -n "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" ]; then
            echo "Configuring Apple Distribution Certificate..."
            KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
            KEYCHAIN_PASSWORD=$(openssl rand -base64 12)

            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

            CERT_PATH=$RUNNER_TEMP/certificate.p12
            echo "${{ secrets.APPLE_CERTIFICATE_BASE64 }}" | base64 -d > "$CERT_PATH"
            security import "$CERT_PATH" -P "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

            # Provisioning Profile
            if [ -n "${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}" ]; then
              mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
              echo "${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
            fi
            
            echo "SIGNING_CONFIGURED=true" >> $GITHUB_ENV
          else
            echo "No Apple Certificate secret provided. Proceeding with Simulator/Unsigned build."
            echo "SIGNING_CONFIGURED=false" >> $GITHUB_ENV
          fi

      - name: Build & Archive iOS App
        run: |
          mkdir -p build/output
          VERSION="${{ env.APP_MARKETING_VERSION }}"
          
          if [ "$SIGNING_CONFIGURED" = "true" ]; then
            echo "Building with Code Signing for App Store / TestFlight..."
            xcodebuild archive \
              -project sing-box.xcodeproj \
              -scheme SFI \
              -archivePath build/HushTunnel.xcarchive \
              -destination 'generic/platform=iOS' \
              -allowProvisioningUpdates \
              MARKETING_VERSION="${{ env.APP_MARKETING_VERSION }}" \
              CURRENT_PROJECT_VERSION="${{ env.APP_BUILD_NUMBER }}"
              
            echo "Exporting IPA package..."
            cat << 'PLIST_EOF' > build/exportOptions.plist
            <?xml version="1.0" encoding="UTF-8"?>
            <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
            <plist version="1.0">
            <dict>
                <key>method</key>
                <string>app-store</string>
                <key>signingStyle</key>
                <string>automatic</string>
                <key>stripSwiftSymbols</key>
                <true/>
                <key>uploadSymbols</key>
                <true/>
            </dict>
            </plist>
          PLIST_EOF
            xcodebuild -exportArchive \
              -archivePath build/HushTunnel.xcarchive \
              -exportPath build/output \
              -exportOptionsPlist build/exportOptions.plist
              
            # Copy versioned IPA alias
            cp build/output/HushTunnel.ipa build/output/HushTunnel-${VERSION}.ipa || true
              
          else
            echo "Building iOS App Bundle (Unsigned/Simulator)..."
            xcodebuild build \
              -project sing-box.xcodeproj \
              -scheme SFI \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build/DerivedData \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              MARKETING_VERSION="${{ env.APP_MARKETING_VERSION }}" \
              CURRENT_PROJECT_VERSION="${{ env.APP_BUILD_NUMBER }}"
              
            mkdir -p build/output/Payload
            cp -r build/DerivedData/Build/Products/Debug-iphoneos/HushTunnel.app build/output/Payload/ || \
            cp -r build/DerivedData/Build/Products/Release-iphoneos/HushTunnel.app build/output/Payload/ || \
            cp -r build/DerivedData/Build/Products/*-iphoneos/*.app build/output/Payload/ || true
            
            cd build/output && zip -q -r HushTunnel.ipa Payload && cp HushTunnel.ipa HushTunnel-${VERSION}.ipa && cd ../..
          fi

      - name: Upload to App Store Connect / TestFlight
        if: env.SIGNING_CONFIGURED == 'true' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' || inputs.upload_to_app_store == true || startsWith(github.ref, 'refs/tags/'))
        run: |
          if [ -n "${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}" ]; then
            echo "Uploading IPA to App Store Connect / TestFlight via altool..."
            mkdir -p ~/.appstoreconnect/private_keys
            echo "${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8
            
            xcrun altool --upload-app \
              -f build/output/HushTunnel.ipa \
              -t ios \
              --apiKey "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" \
              --apiIssuer "${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER }}"
          else
            echo "Skipping App Store upload: APP_STORE_CONNECT_API_KEY_CONTENT secret not configured."
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HushTunnel-iOS-IPA
          path: |
            build/output/*.ipa
            build/output/HushTunnel.ipa

      - name: Determine Release Tag
        id: tag_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.release_tag }}" ]; then
            TAG_NAME="${{ inputs.release_tag }}"
          elif [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v${{ env.APP_MARKETING_VERSION }}"
          fi
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Generate Dynamic Release Notes
        run: |
          VERSION="${{ env.APP_MARKETING_VERSION }}"
          TAG="${{ steps.tag_info.outputs.TAG_NAME }}"
          BUILD="${{ env.APP_BUILD_NUMBER }}"

          # Generate SHA256 checksums
          cd build/output
          shasum -a 256 *.ipa > SHA256SUMS.txt 2>/dev/null || sha256sum *.ipa > SHA256SUMS.txt 2>/dev/null || true
          cd ../..

          # Extract recent changelog
          CHANGELOG=$(git log --pretty=format:"* %s (%h)" -n 12)

          cat << 'HEADER_EOF' > RELEASE_NOTES.md
          ## 🛡️ HushTunnel iOS ${TAG} (Build ${BUILD})

          ### 🚀 What's New & Key Highlights
          - **Multi-Server Location Switching**: Instant interactive server node switcher with dynamic latency checks.
          - **Reseller Self-Service Suite**: Comprehensive customer creation with auto-generated/custom passwords, credential copy modal, and order creation handoff.
          - **Double-Entry Transactions Ledger**: Real-time balance debits/credits history, order tracking, and P2P audit logs.
          - **Full Localization (5 Languages)**: English, Persian (Farsi RTL), Russian, Simplified Chinese, and Turkish.
          - **App Store Review Compliance**: Multi-device account management text linking directly to official control plane at [hushtunnel.com](https://www.hushtunnel.com) (Guideline 3.1.1 compliant).

          ### 📦 Download Packages
          | Package | Description | Target Deployment |
          |---|---|---|
          | **`HushTunnel-${VERSION}.ipa`** (`HushTunnel.ipa`) | Packaged iOS Application Archive | TestFlight / Enterprise / Sideloading (iOS 15.0+) |

          ### 📝 Recent Changes
          HEADER_EOF

          echo "$CHANGELOG" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### 🔒 Binary Integrity (SHA-256)" >> RELEASE_NOTES.md
          echo '```text' >> RELEASE_NOTES.md
          cat build/output/SHA256SUMS.txt >> RELEASE_NOTES.md
          echo '```' >> RELEASE_NOTES.md

          # Replace environment variables in generated file
          sed -i '' "s/\${TAG}/$TAG/g" RELEASE_NOTES.md
          sed -i '' "s/\${BUILD}/$BUILD/g" RELEASE_NOTES.md
          sed -i '' "s/\${VERSION}/$VERSION/g" RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') && github.ref != 'refs/heads/dev'
        with:
          tag_name: ${{ steps.tag_info.outputs.TAG_NAME }}
          name: ${{ inputs.release_title || steps.tag_info.outputs.TAG_NAME }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            build/output/*.ipa
            build/output/HushTunnel.ipa
            build/output/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
