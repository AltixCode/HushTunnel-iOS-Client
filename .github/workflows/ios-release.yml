name: iOS Build & App Store Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - dev
  workflow_dispatch:
    inputs:
      upload_to_app_store:
        description: 'Upload to TestFlight / App Store Connect'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        type: string
      release_title:
        description: 'Release Title'
        required: false
        type: string
        default: 'HushTunnel iOS Release'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Select Xcode Version & Set Developer Directory
        run: |
          echo "Listing installed Xcode versions..."
          ls -d /Applications/Xcode* || true
          
          # Detect installed Xcode paths
          if [ -d "/Applications/Xcode-beta.app" ]; then
            DEV_DIR="/Applications/Xcode-beta.app/Contents/Developer"
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            DEV_DIR="/Applications/Xcode_16.1.app/Contents/Developer"
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            DEV_DIR="/Applications/Xcode_16.0.app/Contents/Developer"
          elif [ -d "/Applications/Xcode.app" ]; then
            DEV_DIR="/Applications/Xcode.app/Contents/Developer"
          else
            DEV_DIR="$(xcode-select -p 2>/dev/null || echo '/Applications/Xcode.app/Contents/Developer')"
          fi
          
          echo "Using Developer Directory: $DEV_DIR"
          echo "DEVELOPER_DIR=$DEV_DIR" >> $GITHUB_ENV
          export DEVELOPER_DIR="$DEV_DIR"
          
          xcodebuild -version
          
          # Ensure iOS platform runtime/device support is present
          xcodebuild -downloadPlatform iOS 2>/dev/null || true
          
          # Output available destinations for verification
          xcodebuild -showdestinations -project sing-box.xcodeproj -scheme SFI || true

      - name: Setup Libbox.xcframework
        run: |
          # 1. Prefer existing verified local Libbox.xcframework if available on runner host
          for LOCAL_PATH in "/Users/atamohammadi/Dev/vpn-ios-client/Libbox.xcframework" "$HOME/Dev/vpn-ios-client/Libbox.xcframework" "/Users/ata/Dev/vpn-ios-client/Libbox.xcframework"; do
            if [ -d "$LOCAL_PATH" ] && [ -f "$LOCAL_PATH/Info.plist" ]; then
              echo "Found verified local Libbox.xcframework at $LOCAL_PATH - copying..."
              rm -rf ./Libbox.xcframework
              cp -r "$LOCAL_PATH" ./Libbox.xcframework
              break
            fi
          done

          # 2. Build from pinned stable sing-box core (commit bdd86c1) if not present
          if [ ! -d "Libbox.xcframework" ] || [ ! -f "Libbox.xcframework/Info.plist" ]; then
            echo "Building Libbox.xcframework from pinned stable sing-box core (commit bdd86c1)..."
            rm -rf /tmp/sing-box-source
            git clone https://github.com/sagernet/sing-box.git /tmp/sing-box-source
            pushd /tmp/sing-box-source
            git checkout bdd86c1
            go install github.com/sagernet/gomobile/cmd/gomobile@latest
            go install github.com/sagernet/gomobile/cmd/gobind@latest
            export PATH=$(go env GOPATH)/bin:$PATH
            gomobile init
            go run ./cmd/internal/build_libbox -target apple -platform ios
            popd
            cp -r /tmp/sing-box-source/Libbox.xcframework ./Libbox.xcframework
          fi
          
          echo "Libbox.xcframework setup complete."

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies -project sing-box.xcodeproj

      - name: Compute Dynamic Version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "Computed Version: 1.0.$COMMIT_COUNT (Build: $COMMIT_COUNT)"
          echo "APP_MARKETING_VERSION=1.0.$COMMIT_COUNT" >> $GITHUB_ENV
          echo "APP_BUILD_NUMBER=$COMMIT_COUNT" >> $GITHUB_ENV

      - name: Setup Signing Keychain & App Store API Key
        id: keychain_setup
        env:
          API_KEY_DATA: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 || secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_KEY_ISSUER: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER }}
          P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 || secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 || secrets.APPLE_CERTIFICATE_BASE64 }}
          P12_PASS: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD || secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD || secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          
          # 1. Setup App Store Connect API Key (.p8)
          if [ -n "$API_KEY_DATA" ] && [ -n "$API_KEY_ID" ]; then
            echo "Setting up App Store Connect API Key: AuthKey_$API_KEY_ID.p8..."
            # Check if base64 or raw string
            if printf '%s' "$API_KEY_DATA" | grep -q "BEGIN PRIVATE KEY"; then
              printf '%s\n' "$API_KEY_DATA" > ~/.appstoreconnect/private_keys/AuthKey_$API_KEY_ID.p8
            else
              printf '%s' "$API_KEY_DATA" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_$API_KEY_ID.p8
            fi
            chmod 600 ~/.appstoreconnect/private_keys/AuthKey_$API_KEY_ID.p8
            echo "API_KEY_CONFIGURED=true" >> $GITHUB_ENV
          else
            echo "API_KEY_CONFIGURED=false" >> $GITHUB_ENV
          fi

          # 2. Setup Distribution Certificate (.p12) in dedicated keychain
          if [ -n "$P12_BASE64" ]; then
            echo "Creating temporary keychain for Apple Distribution Certificate..."
            KEYCHAIN_PATH=$RUNNER_TEMP/build-signing.keychain-db
            KEYCHAIN_PASSWORD=$(openssl rand -base64 12)
            CERT_PATH=$RUNNER_TEMP/dist_cert.p12
            CERT_PEM_PATH=$RUNNER_TEMP/dist_cert.pem
            WWDR_PATH=$RUNNER_TEMP/AppleWWDRCAG3.cer

            # Cancelled self-hosted jobs may leave this task-scoped keychain behind.
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

            export P12_RAW="$P12_BASE64"
            python3 -c "import base64, os; raw=''.join(os.environ['P12_RAW'].split()); open('$CERT_PATH', 'wb').write(base64.b64decode(raw, validate=True))"
            chmod 600 "$CERT_PATH"

            # Let macOS import the P12 directly. Its Keychain importer supports
            # older PKCS#12 encryption variants that the runner's OpenSSL may not.
            echo "Importing certificate and private key into the temporary build keychain..."
            if ! security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASS" -T /usr/bin/codesign -T /usr/bin/security; then
              echo "::error::Keychain could not import APPLE_DISTRIBUTION_P12_BASE64. Check that it is a base64-encoded .p12 and APPLE_DISTRIBUTION_P12_PASSWORD matches its export password."
              exit 1
            fi

            # Apple Distribution identities chain through WWDR G3. Xcode normally
            # installs it, but a headless/self-hosted runner can lack the current
            # intermediate and then report zero valid identities after a good import.
            curl --fail --silent --show-error --location \
              https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer \
              --output "$WWDR_PATH"
            security import "$WWDR_PATH" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security default-keychain -s "$KEYCHAIN_PATH"

            # Keep the runner's other keychains in the search list because macOS
            # uses them for Apple's intermediate/root trust chain.
            EXISTING_KEYCHAINS=$(security list-keychains -d user | sed -e "s/^[ 	]*//" | tr -d "\"" | tr "\n" " ")
            security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS

            echo "Codesigning identities after import:"
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q 'Apple Distribution'; then
              echo "::error::The imported .p12 is not a valid Apple Distribution codesigning identity. It may be revoked, untrusted, for another team, or missing its private key."
              exit 1
            fi
            security find-certificate -c 'Apple Distribution' -p "$KEYCHAIN_PATH" > "$CERT_PEM_PATH"
            echo "Validated Apple Distribution certificate:"
            openssl x509 -in "$CERT_PEM_PATH" -noout -subject -issuer -dates
            
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
            echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV
            echo "KEYCHAIN_CREATED=true" >> $GITHUB_ENV
            echo "SIGNING_CONFIGURED=true" >> $GITHUB_ENV
          elif security find-identity -v -p codesigning | grep -q "Apple Distribution"; then
            echo "Found Apple Distribution certificate in runner host Keychain."
            echo "SIGNING_CONFIGURED=true" >> $GITHUB_ENV
          else
            echo "No Distribution Certificate secret detected."
            echo "SIGNING_CONFIGURED=false" >> $GITHUB_ENV
          fi

      - name: Fetch Distribution Provisioning Profiles
        id: fetch_profiles
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_KEY_ISSUER: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER }}
        run: |
          # Automatic signing (-allowProvisioningUpdates) needs Xcode to bootstrap
          # the account's FULL signing state, including an "iOS Development"
          # certificate+private key - not just the Distribution identity this
          # runner actually has. That bootstrap normally happens once via an
          # Xcode GUI Apple ID sign-in and gets cached in the keychain; the
          # keychain reset wiped that cache, and an App Store Connect API key
          # alone cannot recreate it headlessly (its "Revoke certificate..."
          # error asks for an interactive decision). Automatic signing is
          # fundamentally the wrong tool for a single-purpose archive-only CI
          # runner. Fix: switch to Manual signing - fetch the already-existing
          # App Store distribution profiles via the App Store Connect API
          # (read-only, no certificate creation involved) and pin each target
          # to its profile UUID directly.
          AUTH_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"
          if [ "$API_KEY_CONFIGURED" != "true" ] || [ ! -f "$AUTH_KEY_PATH" ]; then
            echo "::error::App Store Connect API key is required to fetch distribution provisioning profiles for manual signing."
            exit 1
          fi

          # Homebrew's system Python refuses global pip installs (PEP 668). Use a
          # throwaway venv instead of --break-system-packages against a shared,
          # persistent runner interpreter.
          VENV_PATH="$RUNNER_TEMP/asc-api-venv"
          python3 -m venv "$VENV_PATH"
          "$VENV_PATH/bin/pip" install --quiet pyjwt cryptography

          mkdir -p build
          "$VENV_PATH/bin/python3" - "$AUTH_KEY_PATH" "$API_KEY_ID" "$API_KEY_ISSUER" << 'PYEOF'
          import base64, json, os, plistlib, sys, time, urllib.error, urllib.request
          import jwt

          auth_key_path, key_id, issuer_id = sys.argv[1], sys.argv[2], sys.argv[3]
          team_id = "8Q8Y559285"

          # target name -> bundle identifier, from sing-box.xcodeproj/project.pbxproj
          TARGET_BUNDLE_IDS = {
              "SFI": "com.hushtunnel.ios",
              "Extension": "com.hushtunnel.ios.extension",
              "IntentsExtension": "com.hushtunnel.ios.intents",
              "FileProviderExtension": "com.hushtunnel.ios.fileprovider",
              "WidgetExtension": "com.hushtunnel.ios.widget",
              "ShareExtension": "com.hushtunnel.ios.share",
              "ActionExtension": "com.hushtunnel.ios.action",
          }

          with open(auth_key_path) as f:
              private_key = f.read()

          token = jwt.encode(
              {
                  "iss": issuer_id,
                  "iat": int(time.time()),
                  "exp": int(time.time()) + 1200,
                  "aud": "appstoreconnect-v1",
              },
              private_key,
              algorithm="ES256",
              headers={"kid": key_id, "typ": "JWT"},
          )

          def api_get(url):
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return json.loads(resp.read())
              except urllib.error.HTTPError as e:
                  body = e.read().decode(errors="replace")
                  print(f"::error::App Store Connect API request failed ({e.code} {e.reason}): {url}\n{body}", file=sys.stderr)
                  raise

          # Fetch every profile (no server-side type/state filter) so a filter
          # mismatch or a permissions gap shows up as visible data instead of a
          # silent empty result.
          all_profiles = []
          bundle_id_names = {}
          url = "https://api.appstoreconnect.apple.com/v1/profiles?include=bundleId&limit=200"
          while url:
              page = api_get(url)
              for item in page.get("included", []):
                  if item["type"] == "bundleIds":
                      bundle_id_names[item["id"]] = item["attributes"]["identifier"]
              all_profiles.extend(page.get("data", []))
              url = page.get("links", {}).get("next")

          print(f"Fetched {len(all_profiles)} total profile(s) from App Store Connect:")
          for profile in all_profiles:
              attrs = profile["attributes"]
              rel = profile["relationships"]["bundleId"]["data"]
              bundle_identifier = bundle_id_names.get(rel["id"]) if rel else None
              print(
                  f"  - {attrs['name']!r} type={attrs['profileType']} state={attrs['profileState']} "
                  f"bundleId={bundle_identifier} uuid={attrs['uuid']} expires={attrs['expirationDate']}"
              )

          profiles_by_bundle_id = {}
          for profile in all_profiles:
              attrs = profile["attributes"]
              if attrs["profileType"] != "IOS_APP_STORE" or attrs["profileState"] != "ACTIVE":
                  continue
              rel = profile["relationships"]["bundleId"]["data"]
              if rel is None:
                  continue
              identifier = bundle_id_names.get(rel["id"])
              if identifier is None:
                  continue
              existing = profiles_by_bundle_id.get(identifier)
              if existing is None or attrs["createdDate"] > existing["attributes"]["createdDate"]:
                  profiles_by_bundle_id[identifier] = profile

          profiles_dir = os.path.expanduser("~/Library/MobileDevice/Provisioning Profiles")
          os.makedirs(profiles_dir, exist_ok=True)

          xcconfig_lines = [
              "CODE_SIGN_STYLE = Manual",
              f"DEVELOPMENT_TEAM = {team_id}",
              'CODE_SIGN_IDENTITY = "Apple Distribution"',
          ]
          export_profiles = {}
          missing = []

          for target, bundle_id in TARGET_BUNDLE_IDS.items():
              profile = profiles_by_bundle_id.get(bundle_id)
              if profile is None:
                  missing.append(bundle_id)
                  continue
              attrs = profile["attributes"]
              uuid = attrs["uuid"]
              content = base64.b64decode(attrs["profileContent"])
              with open(os.path.join(profiles_dir, f"{uuid}.mobileprovision"), "wb") as f:
                  f.write(content)
              print(f"Installed profile for {bundle_id} ({target}): {attrs['name']} [{uuid}], expires {attrs['expirationDate']}")
              xcconfig_lines.append(f'PROVISIONING_PROFILE_SPECIFIER[target={target}] = {uuid}')
              export_profiles[bundle_id] = uuid

          if missing:
              print("::error::No ACTIVE App Store distribution profile found for: " + ", ".join(missing), file=sys.stderr)
              print("Available bundle IDs with an ACTIVE App Store profile: " + ", ".join(sorted(profiles_by_bundle_id)), file=sys.stderr)
              sys.exit(1)

          with open("build/signing.xcconfig", "w") as f:
              f.write("\n".join(xcconfig_lines) + "\n")

          export_options = {
              "method": "app-store-connect",
              "teamID": team_id,
              "signingStyle": "manual",
              "stripSwiftSymbols": True,
              "uploadSymbols": True,
              "destination": "export",
              "provisioningProfiles": export_profiles,
          }
          with open("build/exportOptions.plist", "wb") as f:
              plistlib.dump(export_options, f)

          print("Wrote build/signing.xcconfig and build/exportOptions.plist")
          PYEOF

      - name: Build & Export Signed App Store Package
        run: |
          mkdir -p build/output

          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            echo "Unlocking build signing keychain..."
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security default-keychain -s "$KEYCHAIN_PATH"
            EXISTING_KEYCHAINS=$(security list-keychains -d user | sed -e "s/^[ 	]*//" | tr -d "\"" | tr "\n" " ")
            security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS
          fi

          echo "Active codesigning identities in session:"
          security find-identity -v -p codesigning || true
          VERSION="${{ env.APP_MARKETING_VERSION }}"
          BUILD_NUM="${{ env.APP_BUILD_NUMBER }}"

          # NOTE: archiving must produce a *signed* app with the real entitlements
          # (com.apple.developer.networking.networkextension, App Groups, etc.) baked
          # in at compile time. Xcode only embeds those from a provisioning profile
          # that actually declares the matching capabilities; without one it silently
          # omits them, and no amount of re-signing at export time can add them back
          # after the fact. Previously this step fell back to an UNSIGNED build
          # (`CODE_SIGNING_ALLOWED=NO`) on any failure, which always shipped an
          # archive with no entitlements at all -> "Missing Entitlement" on upload.
          # Never fall back to an unsigned archive for an App Store build.
          #
          # Manual signing via build/signing.xcconfig (written by the previous
          # step) pins each target to its real App Store distribution profile -
          # see that step for why automatic signing doesn't work headlessly here.
          echo "Building Release xcarchive with Xcode (manual signing)..."
          xcodebuild archive \
            -project sing-box.xcodeproj \
            -scheme SFI \
            -archivePath build/HushTunnel.xcarchive \
            -destination "generic/platform=iOS" \
            -xcconfig build/signing.xcconfig \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUM"

          echo "Exporting signed App Store IPA with manually pinned provisioning profiles..."
          xcodebuild -exportArchive \
            -archivePath build/HushTunnel.xcarchive \
            -exportPath build/output \
            -exportOptionsPlist build/exportOptions.plist

          if [ -f "build/output/HushTunnel.ipa" ]; then
            cp build/output/HushTunnel.ipa build/output/HushTunnel-$VERSION.ipa
            echo "IPA exported successfully with embedded provisioning profile:"
            ls -lh build/output/
          else
            echo "Error: xcodebuild did not create HushTunnel.ipa"
            exit 1
          fi

      - name: Upload to App Store Connect / TestFlight
        if: env.API_KEY_CONFIGURED == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || inputs.upload_to_app_store == true || startsWith(github.ref, 'refs/tags/'))
        run: |
          echo "Uploading IPA to App Store Connect / TestFlight via altool..."
          xcrun altool --upload-app \
            -f build/output/HushTunnel.ipa \
            -t ios \
            --apiKey "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER }}"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HushTunnel-iOS-IPA
          path: |
            build/output/*.ipa
            build/output/HushTunnel.ipa

      - name: Determine Release Tag
        id: tag_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.release_tag }}" ]; then
            TAG_NAME="${{ inputs.release_tag }}"
          elif [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v${{ env.APP_MARKETING_VERSION }}"
          fi
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Generate Dynamic Release Notes
        run: |
          VERSION="${{ env.APP_MARKETING_VERSION }}"
          TAG="${{ steps.tag_info.outputs.TAG_NAME }}"
          BUILD="${{ env.APP_BUILD_NUMBER }}"

          # Generate SHA256 checksums
          cd build/output
          shasum -a 256 *.ipa > SHA256SUMS.txt 2>/dev/null || sha256sum *.ipa > SHA256SUMS.txt 2>/dev/null || true
          cd ../..

          # Extract recent changelog
          CHANGELOG=$(git log --pretty=format:"* %s (%h)" -n 12)

          cat << 'HEADER_EOF' > RELEASE_NOTES.md
          ## 🛡️ HushTunnel iOS ${TAG} (Build ${BUILD})

          ### 🚀 What's New & Key Highlights
          - **Multi-Server Location Switching**: Instant interactive server node switcher with dynamic latency checks.
          - **Reseller Self-Service Suite**: Comprehensive customer creation with auto-generated/custom passwords, credential copy modal, and order creation handoff.
          - **Double-Entry Transactions Ledger**: Real-time balance debits/credits history, order tracking, and P2P audit logs.
          - **Full Localization (5 Languages)**: English, Persian (Farsi RTL), Russian, Simplified Chinese, and Turkish.
          - **App Store Review Compliance**: Multi-device account management text linking directly to official control plane at [hushtunnel.com](https://www.hushtunnel.com) (Guideline 3.1.1 compliant).

          ### 📦 Download Packages
          | Package | Description | Target Deployment |
          |---|---|---|
          | **`HushTunnel-${VERSION}.ipa`** (`HushTunnel.ipa`) | Packaged iOS Application Archive | TestFlight / Enterprise / Sideloading (iOS 15.0+) |

          ### 📝 Recent Changes
          HEADER_EOF

          echo "$CHANGELOG" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### 🔒 Binary Integrity (SHA-256)" >> RELEASE_NOTES.md
          echo '```text' >> RELEASE_NOTES.md
          cat build/output/SHA256SUMS.txt >> RELEASE_NOTES.md
          echo '```' >> RELEASE_NOTES.md

          # Replace environment variables in generated file
          sed -i '' "s/\${TAG}/$TAG/g" RELEASE_NOTES.md
          sed -i '' "s/\${BUILD}/$BUILD/g" RELEASE_NOTES.md
          sed -i '' "s/\${VERSION}/$VERSION/g" RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') && github.ref != 'refs/heads/dev'
        with:
          tag_name: ${{ steps.tag_info.outputs.TAG_NAME }}
          name: ${{ inputs.release_title || steps.tag_info.outputs.TAG_NAME }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            build/output/*.ipa
            build/output/HushTunnel.ipa
            build/output/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean signing credentials
        if: always()
        run: |
          if [ -n "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi
          rm -f "$RUNNER_TEMP/dist_cert.p12" "$RUNNER_TEMP/dist_cert.pem" "$RUNNER_TEMP/AppleWWDRCAG3.cer"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8"
